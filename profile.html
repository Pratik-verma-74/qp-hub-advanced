<script>
'use strict';

const firebaseConfig = {
  apiKey: "AIzaSyCjNBGElikDMEdFuWsGeAfjo7cLHjCSnXU",

  projectId: "academic-hub-a70f1",
  storageBucket: "academic-hub-a70f1.firebasestorage.app",
  messagingSenderId: "76238913687",
  appId: "1:76238913687:web:356b292bb690d8460269d2"
};

let db = null;
let auth = null;
let isFirebaseActive = false;
let currentUser = null;
let fileData = null;
let isDataLoaded = false;
let currentPreviewBlobUrl = null;
let currentPreviewPaperId = null;

try {
  if (firebaseConfig.apiKey && firebaseConfig.apiKey.trim() !== "" && firebaseConfig.apiKey !== "AIzaSy...") {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    auth = firebase.auth();
    isFirebaseActive = true;
  }
} catch (err) {
  console.error("Firebase init failed on profile page:", err);
}

document.addEventListener('DOMContentLoaded', () => {
  if (isFirebaseActive) {
    auth.onAuthStateChanged(handleAuthStateChanged);
    syncPapersFromFirestore();
  } else {
    loadSampleData();
    showToast('info', 'Demo Mode Active', 'Profile page is simulated in Offline Demo Mode.');
  }

  // Click outside to close dropdown
  document.addEventListener('click', (e) => {
    const dropdown = document.getElementById('authDropdown');
    const userProfile = document.getElementById('userProfile');
    if (dropdown && dropdown.style.display === 'block' && !userProfile.contains(e.target)) {
      dropdown.style.display = 'none';
    }
  });

  // Modal click outside to close handlers
  document.getElementById('previewModalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('previewModalOverlay')) closePreviewModal();
  });
});

function handleAuthStateChanged(user) {
  currentUser = user;

  // Dismiss page loader
  const loader = document.getElementById('pageLoader');
  if (loader) {
    loader.style.opacity = '0';
    loader.style.visibility = 'hidden';
    setTimeout(() => loader.remove(), 500);
  }

  if (!user) {
    // If not logged in, wait a moment then redirect back to home page
    showToast('warning', 'Login Required', 'You must log in to view your profile. Redirecting to home...');
    setTimeout(() => { window.location.href = 'index.html'; }, 2500);
    return;
  }

  // Update profile header
  const customAvatar = localStorage.getItem('customAvatar_' + user.uid);
  const displayPhoto = customAvatar || user.photoURL || 'https://lh3.googleusercontent.com/a/default-user=s96-c';
  
  document.getElementById('userAvatar').src = displayPhoto;
  document.getElementById('userName').textContent = user.displayName || 'Student';
  document.getElementById('userEmail').textContent = user.email || '';

  // Update dashboard details
  document.getElementById('dashboardAvatar').src = displayPhoto;
  const dName = document.getElementById('dashboardName');
  dName.textContent = user.displayName || 'Student Creator';
  dName.classList.remove('skeleton', 'skeleton-text');
  const dEmail = document.getElementById('dashboardEmail');
  dEmail.textContent = user.email || '';
  dEmail.classList.remove('skeleton', 'skeleton-text', 'short');

  renderPersonalDashboard();
}

function toggleAuthDropdown(e) {
  e.stopPropagation();
  const dd = document.getElementById('authDropdown');
  dd.style.display = (dd.style.display === 'block') ? 'none' : 'block';
}

function logout() {
  if (!isFirebaseActive) {
    window.location.href = 'index.html';
    return;
  }
  auth.signOut().then(() => {
    window.location.href = 'index.html';
  });
}

function syncPapersFromFirestore() {
  if (!isFirebaseActive) return;
  db.collection('papers').orderBy('date', 'desc').onSnapshot(snapshot => {
    const papers = [];
    snapshot.forEach(doc => {
      papers.push({ id: doc.id, ...doc.data() });
    });
    fileData = papers;
    isDataLoaded = true;
    renderPersonalDashboard();

    // Real-time update of open preview modal comments
    if (currentPreviewPaperId) {
      renderCommentsList(currentPreviewPaperId);
    }
  }, err => {
    console.error("Firestore sync error:", err);
  });
}

function loadSampleData() {
  fileData = [
    { id:'s1', name:'BCA_2023_C_Programming.pdf', course:'BCA', year:'2023', subject:'C Programming', semester:'I', url:'#', size:'1.2 MB', date:'2023-11-10', fileType:'pdf', likesCount:15, likedBy:['demo1'], sharesCount:5, comments: [{id:'1', text:'This was super helpful!', userName:'Pratik Verma', userEmail:'admin@gmail.com', userUid:'demo1', date:new Date().toISOString()}], uploaderUid: 'demo-user', uploaderEmail: 'demo@domain.com', uploaderName: 'Student Creator (Demo)' },
    { id:'s2', name:'BCA_2022_DBMS.pdf', course:'BCA', year:'2022', subject:'DBMS', semester:'III', url:'#', size:'980 KB', date:'2022-12-01', fileType:'pdf', likesCount:30, likedBy:[], sharesCount:12, comments: [], uploaderUid: 'demo-user', uploaderEmail: 'demo@domain.com', uploaderName: 'Student Creator (Demo)' }
  ];
  isDataLoaded = true;
  // Simulate log in
  currentUser = {
    displayName: "Student Creator (Demo)",
    email: "demo@domain.com",
    uid: "demo-user",
    photoURL: "https://lh3.googleusercontent.com/a/default-user=s96-c"
  };
  handleAuthStateChanged(currentUser);
}

// Trophy Milestone Engine
function getTrophy(likes) {
  if (!likes || likes < 10) return null;
  if (likes >= 5000) return { icon: '👑', label: 'Crown', class: 'trophy-crown', color: '#ffd700' };
  if (likes >= 1000) return { icon: '🔴', label: 'Ruby', class: 'trophy-ruby', color: '#ff2a2a' };
  if (likes >= 500)  return { icon: '💎', label: 'Diamond', class: 'trophy-diamond', color: '#5eaeff' };
  if (likes >= 100)  return { icon: '🏆', label: 'Platinum', class: 'trophy-platinum', color: '#e5e4e2' };
  if (likes >= 50)   return { icon: '🥇', label: 'Gold', class: 'trophy-gold', color: '#ffd700' };
  if (likes >= 25)   return { icon: '🥈', label: 'Silver', class: 'trophy-silver', color: '#c0c0c0' };
  return { icon: '🥉', label: 'Bronze', class: 'trophy-bronze', color: '#cd7f32' };
}

function renderPersonalDashboard() {
  if (!currentUser) return;

  const myPapers = fileData.filter(p => p.uploaderUid === currentUser.uid);
  
  // Calculate Stats
  const totalUploads = myPapers.length;
  let totalLikes = 0;
  let totalShares = 0;
  
  myPapers.forEach(p => {
    totalLikes += (p.likesCount || 0);
    totalShares += (p.sharesCount || 0);
  });

  document.getElementById('statPersonalFiles').textContent = totalUploads;
  document.getElementById('statLikesReceived').textContent = totalLikes;
  document.getElementById('statSharesReceived').textContent = totalShares;
  document.getElementById('personalFileCountBadge').textContent = totalUploads;

  // Render Trophy wall
  const trophyWall = document.getElementById('trophyWallContainer');
  const trophyList = document.getElementById('trophyList');
  trophyList.innerHTML = '';
  
  let hasTrophy = false;
  myPapers.forEach(p => {
    const trophy = getTrophy(p.likesCount || 0);
    if (trophy) {
      hasTrophy = true;
      trophyList.innerHTML += `
        <div class="trophy-badge-item glass" style="border-color:${trophy.color}40;">
          <span>${trophy.icon}</span>
          <span style="color:${trophy.color};">${trophy.label} Badge</span>
          <span style="font-size:0.7rem; color:var(--text-muted); font-weight:400; max-width: 140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">on ${escapeHtml(p.name)}</span>
        </div>
      `;
    }
  });

  trophyWall.style.display = hasTrophy ? 'block' : 'none';

  // Remove stat skeleton classes
  ['statPersonalFiles','statLikesReceived','statSharesReceived'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.classList.remove('skeleton', 'skeleton-text', 'short'); el.style.height = ''; }
  });

  // Render Grid
  const grid = document.getElementById('personalFileGrid');
  if (!isDataLoaded) {
    grid.innerHTML = Array(3).fill(0).map(() => buildSkeletonCard()).join('');
    return;
  }
  if (myPapers.length === 0) {
    grid.innerHTML = `
      <div style="grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; padding: 60px 20px; text-align: center; animation: fadeIn 0.5s ease;">
        <div style="width:80px; height:80px; border-radius:22px; background:rgba(255,255,255,0.02); border:1px solid var(--glass-border); display:flex; align-items:center; justify-content:center; font-size:2.2rem; color:var(--text-muted); margin-bottom:22px; animation: float 3s ease-in-out infinite;">📂</div>
        <h3 style="font-family:var(--font-head); font-size:1.25rem; font-weight:700; margin-bottom:8px;">No Uploads Yet</h3>
        <p style="color:var(--text-muted); font-size:0.88rem; margin-bottom:24px; max-width:300px; line-height:1.6;">Papers you upload on QPHub will show up here along with your stats and engagement metrics.</p>
        <a href="index.html" class="btn-home"><i class="fas fa-cloud-upload-alt"></i> Upload Now</a>
      </div>
    `;
    return;
  }

  grid.innerHTML = myPapers.map((f, idx) => buildPersonalCard(f, idx)).join('');
}

function buildPersonalCard(f, idx) {
  const delay  = Math.min(idx * 0.05, 0.4);
  const ft     = f.fileType || 'pdf';
  
  const iconMap = { pdf:['pdf-type','fa-file-pdf'], image:['img-type','fa-file-image'], doc:['doc-type','fa-file-word'] };
  const [iconCls, iconFa] = iconMap[ft] || iconMap.pdf;
  const safeUrl  = escapeAttr(f.url || '#');
  const safeName = escapeAttr(f.name || 'file');

  const trophy = getTrophy(f.likesCount || 0);
  const trophyBadge = trophy 
    ? `<div class="card-trophy ${trophy.class}" title="${trophy.label} (${f.likesCount} Likes)" style="display:flex; align-items:center; gap:5px; font-size:0.72rem; font-weight:700; color:${trophy.color}; background:${trophy.color}18; padding:4px 10px; border-radius:50px; border:1px solid ${trophy.color}30; flex-shrink:0;">
         <span>${trophy.icon}</span> <span>${trophy.label}</span>
       </div>`
    : '';

  const commentsCount = f.comments ? f.comments.length : 0;

  return `
    <div class="file-card" style="animation-delay:${delay}s" id="card-${f.id}">
      <div class="card-top">
        <div class="card-pdf-icon ${iconCls}"><i class="fas ${iconFa}"></i></div>
        ${trophyBadge}
      </div>
      <div class="card-name" title="${safeName}">${safeName}</div>
      <div class="card-meta">
        <div class="card-meta-row"><i class="fas fa-graduation-cap"></i>${f.course || ''}</div>
        <div class="card-meta-row"><i class="fas fa-book"></i>${f.subject || ''}</div>
        <div class="card-meta-row"><i class="fas fa-calendar-alt"></i>${f.year || ''}</div>
        <div style="display:flex; gap:12px; margin-top:10px; padding-top:10px; border-top:1px solid var(--glass-border);">
          <span style="display:flex; align-items:center; gap:5px; font-size:0.78rem; font-weight:700; color:var(--error);"><i class="fas fa-heart" style="font-size:0.7rem;"></i>${f.likesCount || 0}</span>
          <span style="display:flex; align-items:center; gap:5px; font-size:0.78rem; font-weight:700; color:var(--accent-2);"><i class="fas fa-share-alt" style="font-size:0.7rem;"></i>${f.sharesCount || 0}</span>
          <span style="display:flex; align-items:center; gap:5px; font-size:0.78rem; font-weight:700; color:var(--accent-1);"><i class="fas fa-comments" style="font-size:0.7rem;"></i>${commentsCount}</span>
        </div>
      </div>
      <div class="card-tags">
        ${f.course ? `<span class="tag tag-course">${f.course}</span>` : ''}
        ${f.year ? `<span class="tag tag-year">${f.year}</span>` : ''}
        ${f.semester ? `<span class="tag tag-sem">Sem ${f.semester}</span>` : ''}
      </div>
      <div class="card-actions">
        <button class="btn-download" onclick="openPreviewModal('${safeUrl}','${safeName}','${ft}', '${f.id}')" style="flex:1; background:var(--glass-bg); border:1px solid var(--glass-border); color:var(--text-primary); box-shadow:none; font-size:0.82rem;">
          <i class="fas fa-eye"></i> View
        </button>
        <button class="btn-download" onclick="downloadFile('${safeUrl}','${safeName}')" style="flex:1.3; font-size:0.82rem;">
          <i class="fas fa-download"></i> Download
        </button>
        <button class="btn-delete-card" onclick="deleteOwnFile('${f.id}')" title="Delete Paper"><i class="fas fa-trash-alt"></i></button>
      </div>
    </div>`;
}

function buildSkeletonCard() {
  return `
    <div class="file-card skeleton-card" style="animation:none; box-shadow:none;">
      <div class="card-top">
        <div class="card-pdf-icon skeleton"></div>
      </div>
      <div class="card-name skeleton skeleton-text medium"></div>
      <div class="card-meta">
        <div class="card-meta-row skeleton skeleton-text short"></div>
        <div class="card-meta-row skeleton skeleton-text short"></div>
      </div>
      <div class="card-actions" style="margin-top:20px; flex-direction:row;">
        <div class="skeleton skeleton-btn"></div>
        <div class="skeleton skeleton-btn"></div>
      </div>
    </div>`;
}

async function deleteOwnFile(fileId) {
  const file = fileData.find(f => f.id === fileId);
  if (!file) return;

  // Client-side ownership validation (Step 5)
  if (!currentUser || file.uploaderUid !== currentUser.uid) {
    showToast('error', 'Denied', 'You do not have permission to delete this paper.');
    return;
  }

  const confirmMsg = `Are you sure you want to delete this paper?\n"${file.name}"`;
  if (!confirm(confirmMsg)) return;

  // Dim card for visual feedback (Step 4)
  const card = document.getElementById(`card-${fileId}`);
  if (card) { card.style.opacity = '0.5'; }

  try {
    if (isFirebaseActive) {
      await db.collection('papers').doc(fileId).delete();
      showToast('success', '🗑️ Deleted', 'Your paper has been permanently deleted.');
      
      // Remove from DOM on success
      if (card) {
        card.style.transition = 'all 0.3s ease';
        card.style.transform = 'scale(0.85)';
        card.style.opacity = '0';
        setTimeout(() => card.remove(), 300);
      }
    } else {
      // Local demo mode deletion
      const idx = fileData.findIndex(f => f.id === fileId);
      if (idx !== -1) fileData.splice(idx, 1);
      
      if (card) {
        card.style.transition = 'all 0.3s ease';
        card.style.transform = 'scale(0.85)';
        card.style.opacity = '0';
        setTimeout(() => card.remove(), 300);
      }
      setTimeout(() => renderPersonalDashboard(), 350);
      showToast('success', '🗑️ Deleted', 'Deleted file in offline demo mode.');
    }
  } catch (err) {
    // Restore opacity on failure
    if (card) { card.style.opacity = '1'; }
    console.error("Delete paper error:", err);
    showToast('error', 'Delete Failed', err.message);
  }
}

// Download PDF as Blob
async function fetchFileAsBlob(url) {
  if (!url || url === '#') throw new Error('Sample file has no URL');
  try {
    const resp = await fetch(url, { mode: 'cors' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    return await resp.blob();
  } catch {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    return await resp.blob();
  }
}

async function downloadFile(url, name) {
  if (!url || url === '#') {
    showToast('info', 'Sample File', 'Sample entries cannot be downloaded.');
    return;
  }
  showToast('info', '⬇️ Starting…', name);
  try {
    const blob = await fetchFileAsBlob(url);
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(blobUrl); document.body.removeChild(a); }, 2000);
    showToast('success', '✅ Downloaded', name);
  } catch (err) {
    window.open(url, '_blank');
    showToast('info', 'Opened in tab', 'Could not force download, opened in new tab instead.');
  }
}

// Document Preview Logic
function openPreviewModal(url, name, fileType, paperId) {
  if (!url || url === '#') {
    showToast('info', 'Sample File', 'Sample entries cannot be previewed.');
    return;
  }

  currentPreviewPaperId = paperId;
  document.getElementById('previewModalTitle').textContent = name;
  
  const dlBtn = document.getElementById('previewDownloadBtn');
  dlBtn.onclick = () => downloadFile(url, name);

  const docContainer = document.getElementById('previewDocContainer');
  docContainer.innerHTML = '<div class="spin" style="font-size: 2rem; color: var(--accent-1);"><i class="fas fa-circle-notch"></i></div>';

  renderCommentsList(paperId);

  setTimeout(() => {
    if (fileType === 'image') {
      docContainer.innerHTML = `<img src="${url}" alt="${name}" style="max-width:100%; max-height:100%; object-fit:contain; border-radius:8px;" />`;
    } else if (fileType === 'pdf') {
      const gviewUrl = `https://docs.google.com/gview?url=${encodeURIComponent(url)}&embedded=true`;
      docContainer.innerHTML = `
        <div style="width:100%; height:100%; display:flex; flex-direction:column;">
          <iframe src="${gviewUrl}" style="flex:1; width:100%; border:none; border-radius:8px 8px 0 0;" title="PDF Preview"></iframe>
          <div style="background:rgba(255,255,255,0.05); padding:8px 10px; text-align:center; font-size:0.75rem; border-top:1px solid var(--glass-border); display:flex; justify-content:center; gap:15px; align-items:center;">
            <span style="color:var(--text-muted);">Preview issue?</span>
            <a href="${url}" target="_blank" style="color:var(--accent-2); text-decoration:none; font-weight:600;"><i class="fas fa-external-link-alt"></i> Open PDF directly</a>
          </div>
        </div>`;
    } else if (fileType === 'doc') {
      const gviewUrl = `https://docs.google.com/gview?url=${encodeURIComponent(url)}&embedded=true`;
      docContainer.innerHTML = `<iframe src="${gviewUrl}" style="width:100%; height:100%; border:none; border-radius:8px;" title="Document Preview"></iframe>`;
    } else {
      docContainer.innerHTML = `
        <div style="text-align:center; color:var(--text-secondary); padding:20px;">
          <i class="fas fa-file-alt" style="font-size:3rem; margin-bottom:12px; color:var(--text-muted);"></i>
          <p>Direct preview is not available for this file type.</p>
          <a href="${url}" target="_blank" style="color:var(--accent-1); text-decoration:none; margin-top:10px; display:inline-block; font-weight:600;">
            <i class="fas fa-external-link-alt"></i> Open in new tab
          </a>
        </div>`;
    }
  }, 400);

  document.getElementById('previewModalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePreviewModal() {
  document.getElementById('previewModalOverlay').classList.remove('open');
  document.body.style.overflow = '';
  document.getElementById('previewDocContainer').innerHTML = '';
  if (currentPreviewBlobUrl) {
    URL.revokeObjectURL(currentPreviewBlobUrl);
    currentPreviewBlobUrl = null;
  }
}

function renderCommentsList(paperId) {
  const paper = fileData.find(p => p.id === paperId);
  const list = document.getElementById('previewCommentsList');
  const countBadge = document.getElementById('previewCommentsCount');

  if (!paper) {
    list.innerHTML = `<div style="text-align:center;color:var(--text-muted);font-size:0.75rem;margin-top:20px;">Document missing</div>`;
    countBadge.textContent = '0';
    return;
  }

  const comments = paper.comments || [];
  countBadge.textContent = comments.length;

  if (comments.length === 0) {
    list.innerHTML = `<div style="text-align:center;color:var(--text-muted);font-size:0.75rem;margin-top:20px;padding:10px;">No comments yet.</div>`;
    return;
  }

  const sorted = [...comments].sort((a,b) => new Date(a.date) - new Date(b.date));

  list.innerHTML = sorted.map(c => {
    const isMe = currentUser && c.userUid === currentUser.uid;
    const timeStr = new Date(c.date).toLocaleDateString('en-IN', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    const initials = (c.userName || '?').substring(0, 1).toUpperCase();
    return `
      <div style="display:flex; gap:8px; align-items:flex-start; ${isMe ? 'flex-direction:row-reverse;' : ''}">
        <div style="width:28px; height:28px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:800; color:#fff;
          background:${isMe ? 'linear-gradient(135deg, var(--accent-1), var(--accent-2))' : 'rgba(255,255,255,0.1)'};
          border:1px solid ${isMe ? 'rgba(181,142,255,0.3)' : 'var(--glass-border)'}; flex-shrink:0;">${initials}</div>
        <div style="flex:1; min-width:0;">
          <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px; ${isMe ? 'flex-direction:row-reverse;' : ''}">
            <span style="font-size:0.7rem; font-weight:700; color:${isMe ? 'var(--accent-1)' : 'var(--text-secondary)'}; white-space:nowrap;">${escapeHtml(c.userName)}</span>
            <span style="font-size:0.6rem; color:var(--text-muted);">${timeStr}</span>
          </div>
          <div style="background:${isMe ? 'linear-gradient(135deg, rgba(181,142,255,0.15), rgba(111,186,255,0.1))' : 'rgba(255,255,255,0.04)'};
            border:1px solid ${isMe ? 'rgba(181,142,255,0.2)' : 'var(--glass-border)'};
            padding:8px 12px; border-radius:${isMe ? '14px 4px 14px 14px' : '4px 14px 14px 14px'};
            font-size:0.8rem; color:var(--text-primary); word-break:break-word; line-height:1.5;">${escapeHtml(c.text)}</div>
        </div>
      </div>
    `;
  }).join('');

  setTimeout(() => { list.scrollTop = list.scrollHeight; }, 50);
}

async function postComment() {
  if (!currentUser) {
    showToast('warning', 'Login Required', 'Please login with Google first to write comments.');
    return;
  }

  const input = document.getElementById('commentInput');
  const text = input.value.trim();
  if (!text || !currentPreviewPaperId) return;

  const paper = fileData.find(p => p.id === currentPreviewPaperId);
  if (!paper) return;

  input.value = '';
  input.style.height = '36px';

  const commentObj = {
    id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    text: text,
    userName: currentUser.displayName || 'Student',
    userEmail: currentUser.email || '',
    userUid: currentUser.uid,
    date: new Date().toISOString()
  };

  try {
    if (isFirebaseActive) {
      await db.collection('papers').doc(currentPreviewPaperId).update({
        comments: firebase.firestore.FieldValue.arrayUnion(commentObj)
      });
    } else {
      if (!paper.comments) paper.comments = [];
      paper.comments.push(commentObj);
      renderCommentsList(currentPreviewPaperId);
      renderPersonalDashboard();
    }
  } catch (err) {
    console.error("Post comment error:", err);
    showToast('error', 'Post Failed', err.message);
  }
}

function handleCommentKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    postComment();
  }
}

function autoResizeTextarea(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function escapeHtml(t) {
  return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(t) {
  return String(t||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatBytes(bytes) {
  if (!bytes) return '0 B';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function showToast(type, title, msg) {
  const icons = { success:'fa-check-circle', error:'fa-times-circle', info:'fa-info-circle', warning:'fa-exclamation-triangle' };
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `
    <i class="fas ${icons[type] || icons.info} toast-icon ${type}"></i>
    <div class="toast-content"><div class="toast-title">${title}</div><div class="toast-msg">${msg}</div></div>
    <i class="fas fa-times toast-close" onclick="this.closest('.toast').remove()"></i>`;
  document.getElementById('toastContainer').appendChild(toast);
  setTimeout(() => { toast.classList.add('hide'); setTimeout(() => toast.remove(), 300); }, 5000);
}

function openEditProfileModal() {
  if (!currentUser) return;
  document.getElementById('editProfileName').value = currentUser.displayName || '';
  document.getElementById('editProfilePreview').src = currentUser.photoURL || 'https://lh3.googleusercontent.com/a/default-user=s96-c';
  document.getElementById('editProfileModalOverlay').style.display = 'flex';
}

function closeEditProfileModal() {
  document.getElementById('editProfileModalOverlay').style.display = 'none';
  document.getElementById('profilePhotoInput').value = '';
}

function previewProfilePhoto(event) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = e => document.getElementById('editProfilePreview').src = e.target.result;
    reader.readAsDataURL(file);
  }
}

async function saveProfile() {
  if (!currentUser) return;
  const newName = document.getElementById('editProfileName').value.trim();
  const fileInput = document.getElementById('profilePhotoInput');
  const btn = document.getElementById('saveProfileBtn');

  if (!newName) {
    showToast('error', 'Error', 'Display name cannot be empty.');
    return;
  }

  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
  btn.disabled = true;

  try {
    // 1. Update Profile Photo in Local Storage (Base64)
    if (fileInput.files.length > 0) {
      const file = fileInput.files[0];
      const reader = new FileReader();
      
      const fileReadPromise = new Promise((resolve) => {
        reader.onload = function(e) {
          const base64Image = e.target.result;
          localStorage.setItem('customAvatar_' + currentUser.uid, base64Image);
          resolve();
        };
      });
      reader.readAsDataURL(file);
      await fileReadPromise;
    }

    // 2. Update Display Name in Firebase Auth
    await currentUser.updateProfile({
      displayName: newName
    });

    // Update UI immediately
    handleAuthStateChanged(auth.currentUser);
    closeEditProfileModal();
    showToast('success', 'Profile Updated', 'Your profile changes have been saved successfully.');

  } catch (error) {
    console.error("Error updating profile:", error);
    showToast('error', 'Update Failed', 'Error: ' + error.message);
  } finally {
    btn.innerHTML = '<i class="fas fa-save"></i> Save Changes';
    btn.disabled = false;
  }
}
