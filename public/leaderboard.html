<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QPHub">
<meta name="theme-color" content="#0a0c1a">
<link rel="apple-touch-icon" href="icon-512x512.png">
<title>Leaderboard | Student Question Paper Hub</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

<!-- Firebase Compat SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="notifications.js"></script>

<style>
  /* ===== CSS VARIABLES (Copied from index.html) ===== */
  :root {
    --font-main: 'Plus Jakarta Sans', sans-serif;
    --font-head: 'Outfit', 'Space Grotesk', sans-serif;
    --bg-base: #06060c;
    --bg-mesh: radial-gradient(circle at 15% 15%, #1d0c3d 0%, transparent 45%),
               radial-gradient(circle at 85% 15%, #0b1a4a 0%, transparent 45%),
               radial-gradient(circle at 50% 85%, #051d38 0%, transparent 50%),
               #06060c;
    --glass-bg: rgba(10, 10, 22, 0.55);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-hover: rgba(255, 255, 255, 0.12);
    --card-bg: rgba(255, 255, 255, 0.03);
    --card-border: rgba(255, 255, 255, 0.07);
    --text-primary: #f8f7ff;
    --text-secondary: rgba(248, 247, 255, 0.70);
    --text-muted: rgba(248, 247, 255, 0.40);
    --accent-1: #b58eff;
    --accent-2: #6fbaff;
    --accent-3: #ff8ec2;
    --accent-grad: linear-gradient(135deg, #b58eff, #6fbaff);
    --accent-grad-glow: 0 0 20px rgba(181, 142, 255, 0.3);
    --shadow-card: 0 12px 40px rgba(0, 0, 0, 0.5);
    --header-bg: rgba(6, 6, 12, 0.8);
  }

  [data-theme="light"] {
    --bg-base: #f4f6fb;
    --bg-mesh: radial-gradient(circle at 15% 15%, #e6daff 0%, transparent 45%),
               radial-gradient(circle at 85% 15%, #d1e4ff 0%, transparent 45%),
               radial-gradient(circle at 50% 85%, #d4f0ff 0%, transparent 50%),
               #f4f6fb;
    --glass-bg: rgba(255, 255, 255, 0.65);
    --glass-border: rgba(155, 109, 255, 0.15);
    --glass-hover: rgba(155, 109, 255, 0.08);
    --text-primary: #120a2e;
    --text-secondary: rgba(18, 10, 46, 0.75);
    --text-muted: rgba(18, 10, 46, 0.45);
    --header-bg: rgba(244, 246, 251, 0.85);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; font-size: 16px; }
  body {
    font-family: var(--font-main);
    background: var(--bg-base);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.4s, color 0.4s;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0;
    background: var(--bg-mesh); pointer-events: none;
  }

  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-border);
  }

  /* ===== HEADER ===== */
  header {
    position: sticky; top: 0; z-index: 100;
    background: var(--header-bg);
    backdrop-filter: blur(24px) saturate(180%);
    border-bottom: 1px solid var(--glass-border);
    padding: 0 clamp(16px, 4vw, 40px);
    height: 72px;
    display: flex; align-items: center; justify-content: space-between;
    transition: background 0.4s;
  }
  .header-brand {
    display: flex; align-items: center; gap: 12px;
    text-decoration: none; color: inherit;
  }
  .brand-icon {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--accent-grad);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #fff;
    box-shadow: var(--accent-grad-glow);
  }
  .brand-title {
    font-family: var(--font-head); font-size: 1.15rem; font-weight: 800;
    background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .brand-sub { font-size: 0.68rem; font-weight: 500; color: var(--text-muted); text-transform: uppercase; }

  .header-actions { display: flex; align-items: center; gap: 12px; }
  .btn-icon, .btn-link {
    height: 40px; border-radius: 12px;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    color: var(--text-secondary); font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s; text-decoration: none;
    font-family: var(--font-main); font-weight: 600; padding: 0 16px;
  }
  .btn-icon { width: 40px; padding: 0; }
  .btn-icon:hover, .btn-link:hover { background: var(--glass-hover); color: var(--accent-1); }

  /* ===== MAIN CONTENT ===== */
  main { position: relative; z-index: 1; padding: clamp(20px, 4vw, 48px) clamp(16px, 4vw, 40px); max-width: 900px; margin: 0 auto; }

  .hero-strip {
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    border-radius: 24px; padding: clamp(24px, 4vw, 40px);
    margin-bottom: 36px; text-align: center;
    position: relative; overflow: hidden;
  }
  .hero-strip::before {
    content: ''; position: absolute; top: -50%; left: 50%; transform: translateX(-50%);
    width: 300px; height: 300px; border-radius: 50%;
    background: radial-gradient(circle, rgba(181,142,255,0.2), transparent 70%);
    pointer-events: none;
  }
  .hero-strip h1 {
    font-family: var(--font-head);
    font-size: clamp(2rem, 5vw, 3rem); font-weight: 800;
    background: linear-gradient(135deg, #ff8ec2, #b58eff, #6fbaff);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
  }
  .hero-strip p { color: var(--text-secondary); font-size: 1rem; max-width: 500px; margin: 0 auto; line-height: 1.6; }

  /* ===== LEADERBOARD TABLE ===== */
  .leaderboard-container {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    overflow: hidden;
    backdrop-filter: blur(20px);
    box-shadow: var(--shadow-card);
  }

  .leaderboard-row {
    display: flex;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid var(--glass-border);
    transition: background 0.2s;
  }
  .leaderboard-row:last-child { border-bottom: none; }
  .leaderboard-row:hover { background: rgba(255,255,255,0.02); }
  
  .leaderboard-header {
    background: rgba(181,142,255,0.08);
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--accent-1);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .leaderboard-header:hover { background: rgba(181,142,255,0.08); }

  .col-rank { width: 60px; font-weight: 800; font-family: var(--font-head); font-size: 1.1rem; color: var(--text-muted); text-align: center; }
  .col-user { flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0; }
  .col-points { width: 120px; text-align: right; font-weight: 800; font-family: var(--font-head); font-size: 1.1rem; color: var(--accent-2); }
  .col-uploads { width: 100px; text-align: right; color: var(--text-secondary); font-size: 0.9rem; font-weight: 600; }

  .user-avatar {
    width: 44px; height: 44px; border-radius: 14px;
    background: var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; color: #fff; flex-shrink: 0;
  }
  .user-avatar.top-1 { background: linear-gradient(135deg, #f59e0b, #fbbf24); box-shadow: 0 0 20px rgba(245,158,11,0.3); }
  .user-avatar.top-2 { background: linear-gradient(135deg, #9ca3af, #d1d5db); }
  .user-avatar.top-3 { background: linear-gradient(135deg, #b45309, #d97706); }
  
  .user-info { display: flex; flex-direction: column; min-width: 0; }
  .user-name { font-weight: 700; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 1rem; }
  .user-badge {
    font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 50px;
    display: inline-block; margin-top: 4px; width: fit-content;
  }
  .badge-legendary { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
  .badge-top { background: rgba(181,142,255,0.15); color: var(--accent-1); border: 1px solid rgba(181,142,255,0.3); }
  .badge-expert { background: rgba(111,186,255,0.15); color: var(--accent-2); border: 1px solid rgba(111,186,255,0.3); }
  .badge-helper { background: rgba(52,211,153,0.15); color: #34d399; border: 1px solid rgba(52,211,153,0.3); }

  .loader { text-align: center; padding: 40px; color: var(--text-muted); }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== RESPONSIVENESS ===== */
  @media (max-width: 768px) {
    body { overflow-x: hidden; padding-bottom: 20px; }
    header { padding: 0 10px; gap: 6px; }
    .header-actions { gap: 6px; }
    .header-brand { gap: 6px; }
    .brand-title { font-size: 1.05rem; }
  }
  @media (max-width: 600px) {
    .col-uploads, .col-exam { display: none; }
    .leaderboard-row { padding: 12px 16px; }
    .col-rank { width: 40px; font-size: 1rem; }
    .user-avatar { width: 36px; height: 36px; font-size: 1rem; }
    .user-name { font-size: 0.9rem; }
    .col-points { font-size: 1rem; }
    .brand-sub { display: none; }
  }

  /* ===== TABS ===== */
  .tabs-container {
    display: flex; gap: 10px; margin-bottom: 24px;
    background: var(--glass-bg); padding: 8px; border-radius: 16px;
    border: 1px solid var(--glass-border); width: fit-content; margin-left: auto; margin-right: auto;
  }
  .tab-btn {
    background: transparent; border: none; color: var(--text-secondary);
    padding: 10px 24px; font-family: var(--font-main); font-weight: 700;
    font-size: 0.9rem; border-radius: 12px; cursor: pointer; transition: all 0.3s;
  }
  .tab-btn.active {
    background: var(--accent-grad); color: white; box-shadow: var(--accent-grad-glow);
  }
  .tab-content { display: none; animation: fadeIn 0.4s ease; }
  .tab-content.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .col-exam { flex: 1; color: var(--text-secondary); font-size: 0.85rem; }
  .col-accuracy { width: 90px; text-align: right; color: var(--success); font-weight: 600; font-size: 0.9rem; }

  /* SKELETON LOADING SYSTEM */
  .skeleton {
    background: linear-gradient(90deg, var(--card-bg) 25%, var(--glass-border) 50%, var(--card-bg) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite linear;
    border-radius: 4px;
    color: transparent !important;
    pointer-events: none;
    border: none !important;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .skeleton-text { height: 0.85rem; margin-bottom: 0.4rem; border-radius: 4px; }
  .skeleton-text.short { width: 35%; }
  .skeleton-text.medium { width: 65%; }
  .skeleton-text.long { width: 90%; }
  .skeleton-avatar { width: 36px; height: 36px; border-radius: 50%; }
</style>

  
  <!-- Anti-Inspect & Security -->
  <script>
    // Disable Right Click
    document.addEventListener('contextmenu', event => event.preventDefault());
    
    // Disable F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
    document.addEventListener('keydown', function(e) {
      if(e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || (e.ctrlKey && e.keyCode === 85)) {
        e.preventDefault();
        return false;
      }
    });
    
    // DevTools Debugger Trap
    setInterval(() => {
      const before = new Date().getTime();
      debugger;
      const after = new Date().getTime();
      if (after - before > 100) {
        document.body.innerHTML = '<h1 style="color:red;text-align:center;margin-top:50px;">Security Alert: Developer Tools detected. Access Denied.</h1>';
      }
    }, 2000);
  </script>
</head>

<body>

<!-- ===== INITIAL LOADER & AUTH CHECK ===== -->
<div id="pageLoader" style="position: fixed; inset: 0; z-index: 1000; background: var(--bg-base); background-image: var(--bg-mesh); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease, visibility 0.5s;">
  <div style="text-align: center;">
    <div class="spin" style="font-size: 3rem; color: var(--accent-1); margin-bottom: 20px; display: inline-block;"><i class="fas fa-circle-notch"></i></div>
    <div style="font-family: var(--font-head); font-weight: 700; font-size: 1.2rem; background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">Checking Access...</div>
  </div>
</div>

<header>
  <a class="header-brand" href="index.html">
    <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
    <div class="brand-text">
      <span class="brand-title">QPHub</span>
      <span class="brand-sub">Question Paper Hub</span>
    </div>
  </a>
  <div class="header-actions">
    <button class="btn-icon" id="themeToggle" title="Toggle theme"><i class="fas fa-moon" id="themeIcon"></i></button>
    <a href="index.html" class="btn-link"><i class="fas fa-arrow-left" style="margin-right: 6px;"></i> Back to Home</a>
    
    <!-- NOTIFICATIONS -->
    <div style="position: relative;">
      <button class="btn-icon" id="notifBellBtn" onclick="toggleNotifications(event)" style="background: transparent; border: none; font-size: 1.1rem; color: var(--text-secondary); position: relative;">
        <i class="fas fa-bell"></i>
        <span id="notifBadge" style="position: absolute; top: 0px; right: 0px; background: var(--error); color: white; font-size: 0.6rem; font-weight: bold; width: 16px; height: 16px; border-radius: 50%; display: none; align-items: center; justify-content: center;">0</span>
      </button>
      <div id="notifDropdown" class="card-dropdown" style="right: 0; top: 46px; min-width: 280px; max-width: 320px; text-align: left; display: none; padding: 0; overflow: hidden; z-index: 1000; box-shadow: 0 10px 40px rgba(0,0,0,0.6);">
        <div style="padding: 12px 16px; border-bottom: 1px solid var(--glass-border); font-weight: 700; font-family: var(--font-head); background: rgba(255,255,255,0.02); display: flex; justify-content: space-between; align-items: center;">
          <span>Notifications</span>
          <i class="fas fa-check-double" style="font-size: 0.8rem; color: var(--accent-1); cursor: pointer;" title="Mark all as read" onclick="markAllNotificationsRead()"></i>
        </div>
        <div id="notifList" style="max-height: 350px; overflow-y: auto; padding: 0;">
           <div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 0.85rem;">Loading...</div>
        </div>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="hero-strip glass">
    <h1>Champions Board 🏆</h1>
    <p>Top contributors and the smartest Quiz players on QPHub!</p>
  </div>

  <div class="tabs-container">
    <button class="tab-btn active" onclick="switchTab('contributorsTab', this)">Top Contributors</button>
    <button class="tab-btn" onclick="switchTab('quizTab', this)">Quiz Champions</button>
  </div>

  <!-- CONTRIBUTORS TAB -->
  <div id="contributorsTab" class="tab-content active">
    <div class="leaderboard-container">
      <div class="leaderboard-row leaderboard-header">
        <div class="col-rank">Rank</div>
        <div class="col-user">Student</div>
        <div class="col-uploads">Uploads</div>
        <div class="col-points">Points</div>
      </div>
      <div id="leaderboardList">
        <div class="loader"><i class="fas fa-circle-notch spin" style="font-size: 2rem;"></i><br><br>Loading Contributors...</div>
      </div>
    </div>
  </div>

  <!-- QUIZ TAB -->
  <div id="quizTab" class="tab-content">
    <div class="leaderboard-container">
      <div class="leaderboard-row leaderboard-header">
        <div class="col-rank">Rank</div>
        <div class="col-user">Student</div>
        <div class="col-exam">Exam / Subject</div>
        <div class="col-accuracy">Accuracy</div>
        <div class="col-points">Score</div>
      </div>
      <div id="quizLeaderboardList">
        <div class="loader"><i class="fas fa-circle-notch spin" style="font-size: 2rem;"></i><br><br>Loading Quiz Scores...</div>
      </div>
    </div>
  </div>
</main>

<script>
  // Setup Theme Toggle
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');
  let currentTheme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);
  themeIcon.className = currentTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';

  themeToggle.addEventListener('click', () => {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', currentTheme);
    localStorage.setItem('theme', currentTheme);
    themeIcon.className = currentTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
  });

  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyCjNBGElikDMEdFuWsGeAfjo7cLHjCSnXU",
    authDomain: "academic-hub-a70f1.firebaseapp.com",
    projectId: "academic-hub-a70f1",
    storageBucket: "academic-hub-a70f1.firebasestorage.app",
    messagingSenderId: "76238913687",
    appId: "1:76238913687:web:356b292bb690d8460269d2"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  initNotificationsSystem(db); // Initialize Notification System

  // AUTH CHECK
  auth.onAuthStateChanged(user => {
    const loader = document.getElementById('pageLoader');
    if (user) {
      // User is logged in, hide loader and fetch data
      if (loader) {
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';
        setTimeout(() => loader.remove(), 500);
      }
      loadLeaderboardData();
      loadQuizScores();
    } else {
      // Not logged in
      loader.innerHTML = `
        <div style="text-align: center; max-width: 400px; padding: 20px;">
          <i class="fas fa-lock" style="font-size: 4rem; color: #fb7185; margin-bottom: 20px;"></i>
          <h2 style="font-family: var(--font-head); margin-bottom: 15px;">Access Denied</h2>
          <p style="color: var(--text-secondary); margin-bottom: 25px;">You must be logged in to view the Leaderboard. Please go back to the home page and log in first.</p>
          <a href="index.html" class="btn-link" style="display: inline-flex; background: var(--accent-grad); color: white; border: none; box-shadow: var(--accent-grad-glow);">
            <i class="fas fa-arrow-left" style="margin-right: 8px;"></i> Back to Home
          </a>
        </div>
      `;
    }
  });

  // Badge Logic
  function getBadgeInfo(count) {
    if (count >= 50) return { title: '👑 Legendary Contributor', cls: 'badge-legendary' };
    if (count >= 20) return { title: '🌟 Top Contributor', cls: 'badge-top' };
    if (count >= 10) return { title: '🎓 Course Expert', cls: 'badge-expert' };
    if (count >= 1)  return { title: '🤝 Helping Hand', cls: 'badge-helper' };
    return null;
  }

  function buildSkeletonRow() {
    return `
      <div class="leaderboard-row" style="margin-bottom:8px; pointer-events:none; align-items:center;">
        <div class="col-rank skeleton skeleton-text short" style="width:20px; margin:0;"></div>
        <div class="col-user" style="flex:1; display:flex; gap:16px;">
          <div class="user-avatar skeleton skeleton-avatar"></div>
          <div class="user-info" style="flex:1;">
            <div class="skeleton skeleton-text medium" style="width:120px; margin-bottom:6px;"></div>
            <div class="skeleton skeleton-text short" style="width:80px; height:0.6rem; margin:0;"></div>
          </div>
        </div>
        <div class="col-uploads skeleton skeleton-text short" style="width:60px; margin:0;"></div>
        <div class="col-points skeleton skeleton-text short" style="width:60px; margin:0;"></div>
      </div>
    `;
  }

  function loadLeaderboardData() {
    document.getElementById('leaderboardList').innerHTML = Array(6).fill(0).map(() => buildSkeletonRow()).join('');
    db.collection('papers').get().then(snapshot => {
      const userMap = {};
      
      snapshot.forEach(doc => {
        const data = doc.data();
        const id = data.uploaderEmail || data.uploaderName || 'Anonymous';
        const name = data.uploaderName || 'Anonymous User';
        
        if (!userMap[id]) {
          userMap[id] = { name: name, uploads: 0, email: data.uploaderEmail || '' };
        }
        userMap[id].uploads++;
      });

      const users = Object.values(userMap).map(u => ({ ...u, points: u.uploads * 10 }));
      users.sort((a, b) => b.points - a.points);
      const validUsers = users.filter(u => u.uploads > 0 && u.name !== 'Anonymous' && u.name !== 'Anonymous User');

      const list = document.getElementById('leaderboardList');
      
      if (validUsers.length === 0) {
        list.innerHTML = '<div class="loader">No contributors yet! Be the first to upload.</div>';
        return;
      }

      list.innerHTML = validUsers.map((user, index) => {
        const rank = index + 1;
        let avatarCls = '';
        let avatarContent = `<i class="fas fa-user"></i>`;
        
        if (rank === 1) { avatarCls = 'top-1'; avatarContent = '🥇'; }
        else if (rank === 2) { avatarCls = 'top-2'; avatarContent = '🥈'; }
        else if (rank === 3) { avatarCls = 'top-3'; avatarContent = '🥉'; }
        else { avatarContent = user.name.charAt(0).toUpperCase(); }

        const badge = getBadgeInfo(user.uploads);
        const badgeHtml = badge ? `<div class="user-badge ${badge.cls}">${badge.title}</div>` : '';

        return `
          <div class="leaderboard-row">
            <div class="col-rank">#${rank}</div>
            <div class="col-user">
              <div class="user-avatar ${avatarCls}">${avatarContent}</div>
              <div class="user-info">
                <div class="user-name">${user.name}</div>
                ${badgeHtml}
              </div>
            </div>
            <div class="col-uploads">${user.uploads} papers</div>
            <div class="col-points">${user.points.toLocaleString()} pts</div>
          </div>
        `;
      }).join('');

    }).catch(err => {
      console.error("Error fetching leaderboard data:", err);
      document.getElementById('leaderboardList').innerHTML = `<div class="loader" style="color:#fb7185"><i class="fas fa-exclamation-triangle"></i> Failed to load leaderboard data.</div>`;
    });
  }

  function loadQuizScores() {
    document.getElementById('quizLeaderboardList').innerHTML = Array(6).fill(0).map(() => buildSkeletonRow()).join('');
    db.collection('quiz_scores').orderBy('score', 'desc').limit(50).get().then(snapshot => {
      const list = document.getElementById('quizLeaderboardList');
      if (snapshot.empty) {
        list.innerHTML = '<div class="loader">No quiz scores yet! Be the first to play.</div>';
        return;
      }

      let html = '';
      let rank = 1;
      const seenUsers = new Set();

      snapshot.forEach(doc => {
        const data = doc.data();
        const uid = data.userId || data.userName || 'anonymous';
        
        if (seenUsers.has(uid)) return; // Only take their highest score
        seenUsers.add(uid);

        let avatarCls = '';
        let avatarContent = `<i class="fas fa-brain"></i>`;
        
        if (rank === 1) { avatarCls = 'top-1'; avatarContent = '🥇'; }
        else if (rank === 2) { avatarCls = 'top-2'; avatarContent = '🥈'; }
        else if (rank === 3) { avatarCls = 'top-3'; avatarContent = '🥉'; }
        else { avatarContent = (data.userName || 'A').charAt(0).toUpperCase(); }

        html += `
          <div class="leaderboard-row">
            <div class="col-rank">#${rank}</div>
            <div class="col-user">
              <div class="user-avatar ${avatarCls}">${avatarContent}</div>
              <div class="user-info">
                <div class="user-name">${data.userName || 'Anonymous Student'}</div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">${data.difficulty || data.mode || 'Normal'} Level</div>
              </div>
            </div>
            <div class="col-exam">
               <div style="font-weight: 600; color: var(--accent-1);">${data.exam}</div>
               <div>${data.subject}</div>
            </div>
            <div class="col-accuracy">${data.accuracy || 0}%</div>
            <div class="col-points">${data.score} pts</div>
          </div>
        `;
        rank++;
      });
      list.innerHTML = html;
    }).catch(err => {
      console.error("Error fetching quiz scores:", err);
      document.getElementById('quizLeaderboardList').innerHTML = `<div class="loader" style="color:#fb7185"><i class="fas fa-exclamation-triangle"></i> Failed to load quiz scores: ${err.message}</div>`;
    });
  }

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(tabId).classList.add('active');
  }

</script>
