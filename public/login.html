<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="QPHub">
    <meta name="theme-color" content="#0a0c1a">
    <link rel="apple-touch-icon" href="icon-512x512.png">
    <title>User Login - QPHub</title>
    <link rel="manifest" href="manifest.json">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1c1c25; /* Modern dark background */
            overflow-x: hidden;
            overflow-y: auto;
            perspective: 1000px;
            padding: 20px 0;
        }

        /* Animated Background Elements */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            filter: blur(80px);
            z-index: 1;
            animation: animateCircle 10s ease-in-out infinite alternate;
        }

        .circle:nth-child(1) {
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
        }

        .circle:nth-child(2) {
            width: 350px;
            height: 350px;
            bottom: -50px;
            right: -50px;
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            animation-delay: -5s;
        }

        @keyframes animateCircle {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-50px) scale(1.1); }
        }

        /* 3D Glassmorphism Login Card */
        .login-box {
            position: relative;
            width: 400px;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            z-index: 2;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 
                20px 20px 50px rgba(0, 0, 0, 0.5),
                inset 5px 5px 15px rgba(255, 255, 255, 0.05),
                inset -5px -5px 15px rgba(0, 0, 0, 0.3);
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }

        /* 3D Hover effect on the whole card */
        .login-box:hover {
            transform: translateY(-10px) rotateX(5deg) rotateY(-5deg);
            box-shadow: 
                30px 30px 60px rgba(0, 0, 0, 0.6),
                inset 5px 5px 15px rgba(255, 255, 255, 0.1),
                inset -5px -5px 15px rgba(0, 0, 0, 0.4);
        }

        .login-box h2 {
            color: #fff;
            text-align: center;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 35px;
            letter-spacing: 1px;
            transform: translateZ(40px); /* 3D pop out effect */
            text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .input-box {
            position: relative;
            width: 100%;
            margin-bottom: 30px;
            transform: translateZ(30px); /* 3D pop out */
        }

        .input-box input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.2);
            border: none;
            outline: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            letter-spacing: 1px;
            box-shadow: 
                inset 3px 3px 8px rgba(0, 0, 0, 0.5),
                inset -3px -3px 8px rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }

        .input-box input:focus {
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 
                inset 3px 3px 8px rgba(0, 0, 0, 0.7),
                inset -3px -3px 8px rgba(255, 255, 255, 0.1),
                0 0 15px rgba(0, 210, 255, 0.4);
        }

        .input-box input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            border: none;
            outline: none;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 
                0 8px 15px rgba(0, 0, 0, 0.3),
                inset 2px 2px 5px rgba(255, 255, 255, 0.3);
            transform: translateZ(40px); /* 3D pop out */
            transition: 0.3s;
            margin-bottom: 20px;
        }

        .btn:hover {
            transform: translateZ(50px) scale(1.05);
            box-shadow: 
                0 15px 25px rgba(0, 0, 0, 0.4),
                inset 2px 2px 5px rgba(255, 255, 255, 0.4),
                0 0 20px rgba(0, 210, 255, 0.5);
        }

        .btn:active {
            transform: translateZ(20px) scale(0.95);
        }

        .links {
            display: flex;
            justify-content: space-between;
            transform: translateZ(30px);
        }

        .links a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s;
        }

        .links a:hover {
            color: #fff;
            text-shadow: 0 0 8px rgba(255,255,255,0.6);
        }
        
        /* Floating decorative elements to enhance 3D feel */
        .login-box::before {
            content: '';
            position: absolute;
            top: -30px;
            left: -30px;
            width: 80px;
            height: 80px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transform: translateZ(60px);
            animation: floatElement1 6s ease-in-out infinite;
        }
        
        .login-box::after {
            content: '';
            position: absolute;
            bottom: -30px;
            right: -30px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transform: translateZ(80px);
            animation: floatElement2 8s ease-in-out infinite reverse;
        }

        @keyframes floatElement1 {
            0%, 100% { transform: translateY(0) translateZ(60px); }
            50% { transform: translateY(-20px) translateZ(60px); }
        }

        @keyframes floatElement2 {
            0%, 100% { transform: translateY(0) translateZ(80px); }
            50% { transform: translateY(-25px) translateZ(80px); }
        }

        .back-btn {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 500;
            z-index: 10;
            transition: 0.3s;
            opacity: 0.7;
        }
        .back-btn:hover {
            opacity: 1;
            transform: translateX(-5px);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: rgba(255,255,255,0.4);
            margin: 20px 0;
            font-size: 14px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .divider span {
            padding: 0 10px;
        }
        
        .google-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.3s;
            transform: translateZ(30px);
        }
        .google-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateZ(40px) scale(1.02);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Mobile responsiveness */
        @media (max-width: 480px) {
            body { overflow-x: hidden; padding-bottom: 20px; }
            .login-box {
                width: 95%;
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Back Button -->
    <a href="index.html" class="back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        Back to Home
    </a>

    <!-- Background Animated Shapes -->
    <div class="circle"></div>
    <div class="circle"></div>

    <!-- 3D Login Panel -->
    <div class="login-box">
        <h2 id="formTitle">Welcome Back</h2>
        <form action="#" id="loginForm">
            <div class="input-box">
                <input type="email" id="email" placeholder="Email Address" required>
            </div>
            <div class="input-box">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">Login</button>
            <div class="links">
                <a href="#" id="forgotLink">Forgot Password?</a>
                <a href="#" id="toggleLink">Sign Up</a>
            </div>
            
            <div class="divider">
                <span>OR</span>
            </div>
            <button type="button" class="google-btn" id="googleLoginBtn">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>
        </form>
    </div>
<script>
  // Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        console.log('SW registered: ', reg.scope);
      }).catch(err => {
        console.log('SW registration failed: ', err);
      });
    });
  }

  // Firebase Configuration & Initialization
  const _fba = atob('QUl6YVN5Q2pOQkdFbGlrRE1FZEZ1V3NHZUFmam83Y0xIakNTblhV');
  const firebaseConfig = {
    apiKey: _fba,
    authDomain: "academic-hub-a70f1.firebaseapp.com",
    projectId: "academic-hub-a70f1",
    storageBucket: "academic-hub-a70f1.firebasestorage.app",
    messagingSenderId: "76238913687",
    appId: "1:76238913687:web:356b292bb690d8460269d2"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  let isSignupMode = false;

  const form = document.getElementById('loginForm');
  const formTitle = document.getElementById('formTitle');
  const submitBtn = document.getElementById('submitBtn');
  const toggleLink = document.getElementById('toggleLink');
  const forgotLink = document.getElementById('forgotLink');

  // Toggle between Login and Sign Up
  toggleLink.addEventListener('click', (e) => {
    e.preventDefault();
    isSignupMode = !isSignupMode;
    formTitle.textContent = isSignupMode ? 'Create Account' : 'Welcome Back';
    submitBtn.textContent = isSignupMode ? 'Sign Up' : 'Login';
    toggleLink.textContent = isSignupMode ? 'Login Instead' : 'Sign Up';
    forgotLink.style.display = isSignupMode ? 'none' : 'block';
  });

  // Forgot Password
  forgotLink.addEventListener('click', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    if (!email) {
      alert('Please enter your email address first to reset password.');
      return;
    }
    auth.sendPasswordResetEmail(email).then(() => {
      alert('Password reset email sent! Check your inbox.');
    }).catch((error) => {
      alert(error.message);
    });
  });

  // Form Submit (Login / Sign Up)
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    submitBtn.textContent = 'Please wait...';
    submitBtn.disabled = true;

    if (isSignupMode) {
      auth.createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
          window.location.href = 'index.html';
        })
        .catch((error) => {
          alert(error.message);
          submitBtn.textContent = 'Sign Up';
          submitBtn.disabled = false;
        });
    } else {
      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          window.location.href = 'index.html';
        })
        .catch((error) => {
          alert(error.message);
          submitBtn.textContent = 'Login';
          submitBtn.disabled = false;
        });
    }
  });

  // Google Login
  const googleBtn = document.getElementById('googleLoginBtn');
  googleBtn.addEventListener('click', () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).then((result) => {
        window.location.href = 'index.html';
    }).catch((error) => {
        alert(error.message);
    });
  });

  // If already logged in, redirect to index
  auth.onAuthStateChanged((user) => {
    if (user) {
      window.location.href = 'index.html';
    }
  });
</script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW fail: ', err));
        });
      }
    </script>
</body>
</html>
